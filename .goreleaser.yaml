version: 2

builds:
  - id: briefkit-ctl
    main: ./cmd/briefkit-ctl
    binary: briefkit-ctl
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

  - id: briefkit-mcp
    main: ./cmd/briefkit-mcp
    binary: briefkit-mcp
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

  - id: briefkit-runner
    main: ./cmd/briefkit-runner
    binary: briefkit-runner
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: briefkit
    formats:
      - tar.gz
    format_overrides:
      - goos: darwin
        formats:
          - zip
    name_template: "briefkit_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  disable: true

release:
  github:
    owner: orbiqd
    name: orbiqd-briefkit
  draft: false
  prerelease: auto

brews:
  - name: briefkit
    repository:
      owner: orbiqd
      name: homebrew-briefkit
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/orbiqd/orbiqd-briefkit"
    description: "Local orchestration tool for subscription-based coding CLIs"
    license: MIT
    install: |
      bin.install "briefkit-ctl"
      bin.install "briefkit-mcp"
      bin.install "briefkit-runner"
    test: |
      system "#{bin}/briefkit-ctl", "--version"
